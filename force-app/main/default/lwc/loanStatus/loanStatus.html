<template>
    <lightning-card title="Loan Enquiry Status" icon-name="standard:approval">

        <div class="slds-p-around_medium">

            <lightning-input label="Loan Enquiry ID" value={loanEnquiryId} onchange={handleIdChange}
                placeholder="Enter Loan Enquiry ID" required>
            </lightning-input>

            <div class="slds-m-top_medium">
                <lightning-button variant="brand" label="Check Status" onclick={handleSearch} disabled={isLoading}>
                </lightning-button>
            </div>

            <template if:true={isLoading}>
                <div class="slds-m-top_medium">
                    <lightning-spinner alternative-text="Loading">
                    </lightning-spinner>
                </div>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-m-top_medium slds-text-color_error">
                    {errorMessage}
                </div>
            </template>

            <template if:true={loanEnquiry}>
                <div class="slds-m-top_large">

                    <div class="slds-box">

                        <p>
                            <strong>Applicant:</strong>
                            {loanEnquiry.Applicant_Name__c}
                        </p>

                        <p>
                            <strong>Loan Amount:</strong>
                            <lightning-formatted-number value={loanEnquiry.Loan_Amount__c} format-style="currency">
                            </lightning-formatted-number>
                        </p>

                        <p>
                            <strong>Loan Purpose:</strong>
                            {loanEnquiry.Loan_Purpose__c}
                        </p>

                        <p>
                            <strong>Status:</strong>
                            {loanEnquiry.Status__c}
                        </p>

                        <p>
                            <strong>External Check Status:</strong>
                            {loanEnquiry.External_Check_Status__c}
                        </p>

                        <p>
                            <strong>External Check Result:</strong>
                            {loanEnquiry.External_Check_Result__c}
                        </p>

                    </div>

                </div>
            </template>

        </div>

    </lightning-card>
</template>
